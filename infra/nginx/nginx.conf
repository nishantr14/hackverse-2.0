# Engineering Spend Intelligence — reverse proxy.
# Owner: shared infra. The only port meant to reach this stack from the
# network; backend/frontend/postgres all bind to the host's loopback only.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Same-origin API access — the frontend calls /api/... so the browser
    # never needs cross-origin CORS handling for the proxied path.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
