[project]
name = "engineering-spend-intelligence-backend"
version = "0.1.0"
description = "Process mining for the SDLC: cost, waste, and a what-if simulator over GitHub + Jira + synthetic event data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pandas>=2.2",
    "lightgbm>=4.5",
    # Only used by app/cost/rate_card.py to read config/rates.yaml. Already
    # present transitively via uvicorn[standard]; declared so it is not one
    # `pip install` away from vanishing.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Without this section ruff has NO config anywhere in the repo, and its
# first-party detection then depends on the directory you invoke it from:
# run inside backend/ it sees app/ and sorts `from app...` as first-party;
# run from the repo root it does not, and reports 24 I001 import-order
# errors in the same untouched files. Worse, `--fix` from either end makes
# the other end fail. Naming app explicitly makes both agree.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
