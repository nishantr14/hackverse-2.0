# =====================================================================
# Rate card and band-inference thresholds.
# Owner: Diljit (cost lane).
#
# TWO SEPARATE THINGS, AND A JUDGE WILL SEPARATE THEM.
#
#   rate_card       PUBLIC and CITED. The hourly figures come from a
#                   published compensation source with a URL on screen.
#   band_inference  INFERRED and LABELLED. Which band an actor sits in is a
#                   stated rule over contribution history, never a fact
#                   about a person. actor.band_basis is 'inferred', always.
#
# Nothing here is code. Change a number, re-run, done.
# =====================================================================

rate_card:
  # ------------------------------------------------------------------
  # ONE source, FOUR percentiles. The page publishes a distribution, not a
  # per-level table, so the band medians below are the p25/p50/p75/p90 of
  # that single distribution. Stating the mapping is the point: it is one
  # URL, one retrieval date, and a rule anyone can re-derive.
  #
  # WHY THIS AND NOT THE PAYSCALE CARD: every cost_event row in the demo
  # database was priced with these figures. The two cards differ by roughly
  # 2.5x, so swapping the citation without re-running the whole cost chain
  # would leave the repo claiming one source while the screens showed
  # another. Decided deliberately — see the note in .claude/CLAUDE.md.
  #
  # KNOWN BIAS, SAY IT ON THE SLIDE: levels.fyi is self-reported and skews
  # toward product and multinational employers, so these sit above the
  # all-India market including IT services. That makes our spend figures
  # conservative-high, which is the safe direction for a waste argument.
  # ------------------------------------------------------------------
  source:
    publisher: "Levels.fyi — Software Engineer salaries, India (percentile distribution; self-reported)"
    url: "https://www.levels.fyi/t/software-engineer/locations/india"
    retrieved: "2026-08-09"

  currency: INR

  # Fully-loaded multiplier: salary plus employer's cost of employment
  # (benefits, equipment, facilities, employer contributions). State it on
  # the slide — an unloaded rate understates true spend by roughly a third.
  loading: 1.30

  # hourly = (annual * loading) / (working_days * hours_per_day)
  # 230 = 365 - 104 weekend days - ~10 public holidays - ~21 leave days.
  working_days: 230
  hours_per_day: 8

  # Annual medians, in `currency`, BEFORE the loading multiplier.
  # Percentile of the cited distribution -> band. p50 is the exact published
  # median; the other three are the published percentile figures.
  #
  # These are the figures the rate_card table in the demo database holds.
  # Change one and you MUST re-run the cost chain, or the screens and this
  # file stop agreeing.
  bands:
    junior: {annual: 1660000}    # p25
    mid: {annual: 2953971}       # p50 (published median)
    senior: {annual: 4830000}    # p75
    staff: {annual: 6950000}     # p90

band_inference:
  # ------------------------------------------------------------------
  # The stated rule. First band whose conditions all hold, in this order.
  # Every condition is a floor: the actor must meet or exceed it.
  #
  # `tenure_months` is the span from an actor's first event to their last,
  # `reviews` counts reviews given, `merged` counts distinct work items
  # where this actor AUTHORED the commit that was merged.
  #
  # Run `python -m app.cost.band_inference --dry-run` before changing
  # these. It prints the distribution these produce and the actor count at
  # every candidate value, so the choice is yours and it is on the record.
  # ------------------------------------------------------------------
  thresholds:
    staff:
      tenure_months: 24
      reviews: 100
    senior:
      tenure_months: 12
      merged: 30
    mid:
      tenure_months: 6
    # junior is the fallthrough and takes no conditions.

  # Printed beside the result so the gap is visible rather than argued.
  target_distribution:
    staff: 10
    senior: 30
    mid: 40
    junior: 20

ci_cost:
  # ------------------------------------------------------------------
  # Machine time, not engineer time — so this is priced at the published
  # runner rate, never at a salary band. Standard Linux 2-core (x64) is the
  # runner class Apache CI uses for the overwhelming majority of jobs.
  #
  # $0.006/min x 95.21 INR/USD = 0.57126 INR/min. The FX rate is the same
  # one config/ai_rates.yaml uses, deliberately: two different USD->INR
  # rates in one database means two costs for the same minute.
  # ------------------------------------------------------------------
  source:
    publisher: "GitHub Docs — About billing for GitHub Actions (standard Linux 2-core x64, $0.006/min); converted at 95.21 INR/USD, Frankfurter API (ECB reference rates), rate dated 2026-08-07"
    url: "https://docs.github.com/en/billing/managing-billing-for-your-products/about-billing-for-github-actions"
    retrieved: "2026-08-09"
  currency: INR
  cost_per_runner_minute: 0.57126

carbon:
  # ------------------------------------------------------------------
  # FILL THESE IN. Converts runner-minutes to kgCO2e. Two citations, not
  # one: a grid emissions factor AND an assumed CI-runner power draw, since
  # neither alone gets you from minutes to carbon.
  # ------------------------------------------------------------------
  source:
    publisher: ""
    url: ""
    retrieved: ""
  grid_kg_co2_per_kwh: null
  runner_power_watts: null
